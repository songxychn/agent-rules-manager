name: 功能建议
description: 提议行为或安全模型变更；动手前请先开 Issue
title: "[建议] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        会静默覆盖未托管文件、不经预览写入、同步本机状态，或绕过漂移检查的改动不会被接受。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前行为卡在哪里，或缺少哪一步。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的界面、CLI 或规则库行为。不必附实现补丁。
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: 是否触及安全边界
      description: 涉及文件系统写入、接管已有文件、回滚或同步范围时请选「是」，并在方案里说明如何保持预览、备份和漂移保护。
      options:
        - 否，只影响展示或文案
        - 是，涉及写入、接管、回滚或同步
        - 不确定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 可选。说明为何现有 Profile、接入或历史恢复不够用。
