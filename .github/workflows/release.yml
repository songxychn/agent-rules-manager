name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-15
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust-target: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-15
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust-target: x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles deb,appimage
            rust-target: ""
          - name: Windows
            platform: windows-latest
            args: --bundles nsis
            rust-target: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Select repository Rust toolchain
        run: rustup show

      - name: Read version notes from CHANGELOG
        id: release-notes
        shell: bash
        run: |
          version=$(bun -e 'console.log(require("./src-tauri/tauri.conf.json").version)')
          bun tools/release-notes.ts CHANGELOG.md "$version" "$GITHUB_OUTPUT"

      - name: Add cross-compile target
        if: matrix.rust-target != ''
        run: rustup target add ${{ matrix.rust-target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.platform }}
          save-if: ${{ github.event_name == 'push' }}

      - name: Install Linux WebKit dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Empty APPLE_* secrets still become env vars. Tauri then tries `security import`
      # and macOS bundling fails. Only export them when a certificate is actually set.
      - name: Export Apple signing environment
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_VALUE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_VALUE: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_VALUE: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_VALUE: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_VALUE" ]; then
            echo "No Apple certificate configured; macOS bundles will be unsigned."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<EOF"
            echo "$APPLE_CERTIFICATE_VALUE"
            echo "EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_VALUE"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_VALUE"
            echo "APPLE_ID=$APPLE_ID_VALUE"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_VALUE"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_VALUE"
          } >> "$GITHUB_ENV"

      - name: Build installers
        uses: tauri-apps/tauri-action@a6e90ddc4ba4721f294e52b856d3d50e645edc07 # v0 / action-v1.0.0 + retry fix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Agent Rules Manager ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: ${{ steps.release-notes.outputs.notes }}
          releaseDraft: ${{ github.ref_type != 'tag' }}
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  verify-updater:
    name: Verify updater manifest
    needs: bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Check the merged manifest after every platform has finished uploading.
      # tauri-action only warns when an updater signature is missing.
      - name: Check all supported updater platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(bun -e 'console.log(require("./src-tauri/tauri.conf.json").version)')
          gh release download "${RELEASE_TAG:-v$version}" --pattern latest.json --dir "$RUNNER_TEMP/updater"
          bun tools/release-notes.ts CHANGELOG.md "$version" > "$RUNNER_TEMP/updater/notes.md"
          bun tools/verify-updater-manifest.ts "$RUNNER_TEMP/updater/latest.json" "$version" "$RUNNER_TEMP/updater/notes.md"
          gh release view "${RELEASE_TAG:-v$version}" --json body --jq .body > "$RUNNER_TEMP/updater/release-body.md"
          diff -u "$RUNNER_TEMP/updater/notes.md" "$RUNNER_TEMP/updater/release-body.md"
